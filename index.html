<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>HitHunter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#111318; --card:#1C1F27; --card2:#2A2E3A; --line:#343846;
    --text:#F4F1EA; --muted:#A7ABB8; --accent:#FFB547; --accent-ink:#1A1300; --accent-soft:#2A2416;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;min-height:100dvh}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:20px;
    padding:calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
  h1,h2,.display{font-family:'Space Grotesk',sans-serif;margin:0}
  p{margin:0}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;letter-spacing:-.5px;color:var(--accent)}
  .muted{color:var(--muted)}
  .label{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px}
  .card{background:var(--card);border-radius:16px;padding:12px 14px}
  .grow{flex:1;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
  button,.btn{font:inherit;color:var(--text);border:0;cursor:pointer;text-decoration:none}
  .btn{min-height:48px;padding:0 16px;border-radius:14px;background:var(--card2);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{min-height:60px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px}
  .btn.primary:disabled{opacity:.4}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.link{background:transparent;color:var(--accent);min-height:44px}
  .btn.spotify{background:#1C1F27;border:1px solid var(--line)}
  .icon{width:44px;height:44px;border-radius:12px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .avatar{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  input[type=text],input[type=search]{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:16px}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .seg button{height:48px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:16px}
  .seg button[aria-pressed=true]{border:2px solid var(--accent);background:var(--accent-soft)}
  .switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
  .switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--text);transition:left .15s}
  .switch[aria-checked=true]{background:var(--accent)}
  .switch[aria-checked=true]::after{left:24px;background:var(--accent-ink)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .country{min-height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:14px;background:var(--card);border:2px solid transparent;width:100%;text-align:left}
  .country[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
  .code{width:38px;height:28px;border-radius:6px;background:var(--card2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .list{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:44vh;padding-right:2px}
  .progress{display:flex;gap:6px}
  .progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .progress span.on{background:var(--accent)}
  .players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .player{min-height:96px;border-radius:18px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
  .player b{font-size:20px}
  .player span{font-size:13px;color:var(--muted)}
  .player.host{border:1px dashed var(--line);color:var(--muted);cursor:default}
  .hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px;border-radius:22px;background:var(--card);text-align:center}
  .big{font-family:'Space Grotesk',sans-serif;font-size:48px;font-weight:700;line-height:1.05;color:var(--accent);word-break:break-word}
  .stand{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:14px;background:var(--card)}
  .stand .n{width:20px;font-weight:700;color:var(--muted)}
  .stand .pts{min-width:48px;text-align:right;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
  .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
  .podium .col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
  .podium .col>span{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .podium .blk{width:100%;border-radius:14px 14px 4px 4px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 12px;border-radius:999px;background:var(--card);font-size:14px}
  .peek{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;user-select:none;-webkit-user-select:none;touch-action:none}
  .sr{position:absolute;left:-9999px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:20px}
  .sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
  .err{color:#FF8FA0;font-size:14px}
</style>
</head>

  function spSetupCard(){
    if(!CAN_SPOTIFY) return '';
    if(spConnected()) return '<div class="card row"><div class="grow stack" style="gap:2px"><span style="font-weight:600;font-size:15px">Spotify connected</span>'+
      '<span class="muted" style="font-size:13px">Songs play on the host\'s Spotify without leaving the game</span></div>'+
      '<button class="btn ghost" style="min-height:44px;font-size:14px" data-a="spout">Disconnect</button></div>';
    var cid = spClientId();
    return '<div class="card stack"><span style="font-weight:600;font-size:15px">Play songs from the game</span>'+
      '<span class="muted" style="font-size:13px">Connect the host\'s Spotify Premium so songs play without switching apps.</span>'+
      (cid ? '' : '<form class="row" style="gap:8px" data-form="cid"><label class="sr" for="cid">Spotify Client ID</label>'+
        '<input id="cid" type="text" placeholder="Spotify Client ID" autocomplete="off" spellcheck="false"><button class="btn" type="submit">Save</button></form>')+
      (cid ? '<button class="btn" data-a="splogin">Connect Spotify</button>' : '')+'</div>';
  }

  var app = document.getElementById('app');

  function render(keepScroll){
    save();
    var h = ({setup:vSetup, pick:vPick, play:vPlay, reveal:vReveal, final:vFinal}[S.screen] || vSetup)();
    if(modal) h += modal;
    app.innerHTML = h;
    if(!keepScroll) window.scrollTo(0,0);
  }

  // ---------- Screens ----------
  function vSetup(){
    var rows = S.players.map(function(p,i){
      var c = col(i), isHost = i===S.host;
      return '<div class="card row">'+
        '<div class="avatar" style="background:'+c.c+';color:'+c.ink+'">'+esc(p.name.charAt(0).toUpperCase())+'</div>'+
        '<div class="grow stack" style="gap:2px"><span style="font-weight:600;font-size:16px">'+esc(p.name)+'</span>'+
        (isHost ? '<span class="muted" style="font-size:13px">Host · plays the songs</span>'
                : '<button class="btn link" style="min-height:28px;padding:0;justify-content:flex-start;font-size:13px" data-a="host" data-i="'+i+'">Make host</button>')+
        '</div>'+
        '<button class="icon" aria-label="Remove '+esc(p.name)+'" data-a="rm" data-i="'+i+'">'+I.x+'</button></div>';
    }).join('');
    var enough = guessers().length >= 1;
    return ''+
      '<div class="stack" style="gap:6px"><div class="brand">HitHunter</div>'+
      '<p class="muted" style="font-size:15px;line-height:1.45">Hear a country\'s Top 50. Shout the country. First right answer scores.</p></div>'+
      '<section class="stack"><div class="label">Players · '+S.players.length+'</div>'+ rows +
      '<form class="row" style="gap:8px" data-form="add"><label class="sr" for="newp">Player name</label>'+
      '<input id="newp" type="text" placeholder="'+(S.players.length? 'Add a player' : 'Add the host first')+'" autocomplete="off" maxlength="20" enterkeyhint="done">'+
      '<button class="btn" type="submit">Add</button></form></section>'+
      '<section class="stack"><div class="label">Rounds</div><div class="seg">'+
        [5,10,15].map(function(n){return '<button aria-pressed="'+(S.rounds===n)+'" data-a="rounds" data-n="'+n+'">'+n+'</button>';}).join('')+
      '</div>'+
      '<div class="card row"><div class="grow stack" style="gap:2px"><span style="font-weight:600;font-size:15px">Fewer points per extra song</span>'+
      '<span class="muted" style="font-size:13px">'+(S.graded? 'Song 1 = 3 pts, song 2 = 2, song 3 = 1' : 'Every right answer = 1 pt')+'</span></div>'+
      '<button class="switch" role="switch" aria-checked="'+S.graded+'" aria-label="Fewer points per extra song" data-a="graded"></button></div></section>'+
      spSetupCard()+(spMsg && S.screen==='setup' ? '<p class="muted" style="font-size:14px">'+esc(spMsg)+'</p>' : '')+
      '<div class="bottom">'+
      (!enough ? '<p class="muted" style="text-align:center;font-size:14px">Add the host plus at least one guesser.</p>' : '')+
      '<button class="btn primary" data-a="start" '+(enough?'':'disabled')+'>Start game</button></div>';
  }

  function vPick(){
    var q = S.search.trim().toLowerCase();
    var left = COUNTRIES.filter(function(c){ return S.used.indexOf(c[0])<0 && (!q || c[1].toLowerCase().indexOf(q)>=0 || c[0].toLowerCase()===q); });
    function row(c){
      var sel = S.country===c[0], n = hasLocal(c[0]) ? LOCAL[c[0]].length : 0;
      return '<button class="country" aria-pressed="'+sel+'" data-a="choose" data-c="'+c[0]+'"><span class="code">'+c[0]+'</span>'+
        '<span class="grow" style="font-size:16px;font-weight:600">'+esc(c[1])+'</span>'+
        '<span class="muted" style="font-size:13px">'+(sel?'Selected':(n? n+' local songs':''))+'</span></button>';
    }
    var ready = left.filter(function(c){ return hasLocal(c[0]); });
    var other = left.filter(function(c){ return !hasLocal(c[0]); });
    var items = (ready.length ? '<div class="label" style="margin-top:4px">Local songs ready · '+ready.length+'</div>'+ready.map(row).join('') : '')+
      (other.length ? '<div class="label" style="margin-top:12px">Full chart only · not filtered</div>'+other.map(row).join('') : '') ||
      '<p class="muted">No countries match.</p>';
    return ''+
      '<div class="topbar"><span>Round '+S.round+' of '+S.rounds+'</span><span class="pill">'+I.eyeOff+'Host only</span></div>'+
      '<div class="stack" style="gap:6px"><h1 style="font-size:28px;line-height:1.15">Pick a secret country</h1>'+
      '<p class="muted" style="font-size:15px">Tilt the phone away from the back seat.</p></div>'+
      '<div class="row" style="gap:8px"><label class="sr" for="cs">Search countries</label>'+
      '<input id="cs" type="search" placeholder="Search countries" value="'+esc(S.search)+'" autocomplete="off">'+
      '<button class="btn" style="width:48px;padding:0" aria-label="Random country" data-a="random">'+I.shuffle+'</button></div>'+
      (DATA_DATE.indexOf('/*')<0 ? '<p class="muted" style="font-size:13px">International hits removed · charts from '+esc(DATA_DATE)+'</p>' : '')+
      '<div class="list" id="clist">'+items+'</div>'+
      '<div class="bottom"><button class="btn primary" data-a="lock" '+(S.country?'':'disabled')+'>'+(S.country? 'Lock in '+esc(countryName(S.country)) : 'Choose a country')+'</button>'+
      '<button class="btn link" data-a="menu">Scores &amp; menu</button></div>';
  }

  function vPlay(){
    var bars=''; for(var k=1;k<=S.songs;k++) bars += '<span class="'+(k<=S.song?'on':'')+'"></span>';
    var pts = ptsFor(S.song);
    var tiles = S.players.map(function(p,i){
      var c = col(i);
      if(i===S.host) return '<div class="player host"><b style="font-size:18px;font-weight:600">'+esc(p.name)+'</b><span>Host</span></div>';
      return '<button class="player" style="background:'+c.bg+';border-color:'+c.c+'" data-a="award" data-i="'+i+'"><b>'+esc(p.name)+'</b><span>'+p.score+' pts</span></button>';
    }).join('');
    var last = S.song >= S.songs;
    return ''+
      '<div class="topbar"><span>Round '+S.round+' of '+S.rounds+'</span>'+
      '<button class="peek" id="peek" aria-label="Hold to see the country">'+I.eye+'<span id="peekt">Hold to peek</span></button></div>'+
      '<div class="card stack" style="gap:14px;padding:20px;border-radius:20px"><div class="progress">'+bars+'</div>'+
      '<div class="row" style="justify-content:space-between;align-items:baseline"><span class="display" style="font-size:30px;font-weight:700">Song '+S.song+' of '+S.songs+'</span>'+
      '<span class="display" style="font-size:22px;font-weight:700;color:var(--accent)">'+pts+' pt'+(pts>1?'s':'')+'</span></div>'+
      (curSong() && spConnected()
        ? '<p class="muted" style="font-size:14px;line-height:1.5">A local hit, picked at random. It plays on the host\'s Spotify.</p>'+
          '<div class="row" style="gap:8px"><button class="btn primary grow" style="min-height:56px;font-size:17px" data-a="spplay" '+(spBusy?'disabled':'')+'>'+I.play+'Play song '+S.song+'</button>'+
          '<button class="btn" style="min-height:56px" aria-label="Pause" data-a="sppause"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button></div>'+
          (spMsg ? '<p class="muted" style="font-size:13px;text-align:center" role="status">'+esc(spMsg)+'</p>' : '')+
          '<div class="row" style="justify-content:space-between"><button class="btn link" style="min-height:36px;font-size:13px;color:var(--muted);padding:0" data-a="skipsong">Pick a different song</button>'+
          '<a href="'+songUrl(curSong())+'" target="_blank" rel="noopener" style="font-size:13px;color:var(--muted)">Open in Spotify</a></div>'
      : curSong()
        ? '<p class="muted" style="font-size:14px;line-height:1.5">A local hit, picked at random. Tap to play it in Spotify, then come back here.</p>'+
          '<a class="btn spotify" href="'+songUrl(curSong())+'" target="_blank" rel="noopener">'+I.play+'Play song '+S.song+' in Spotify</a>'+
          '<button class="btn link" style="min-height:36px;font-size:13px;color:var(--muted)" data-a="skipsong">Can\'t find it? Pick a different song</button>'
        : '<p class="muted" style="font-size:14px;line-height:1.5">Play a song from the country\'s Top 50. Skip anything that charts in other countries too.</p>'+
          '<a class="btn spotify" href="'+spotifyUrl(S.country)+'" target="_blank" rel="noopener">'+I.play+'Open the Top 50 in Spotify</a>'+
          '<a href="'+searchUrl(S.country)+'" target="_blank" rel="noopener" style="font-size:13px;text-align:center;color:var(--muted)">Wrong playlist? Search Spotify instead</a>')+
      '</div>'+
      '<section class="stack"><div class="label">Who said it first?</div><div class="players">'+tiles+'</div></section>'+
      '<div class="bottom">'+
      (last ? '<button class="btn" data-a="nobody">Nobody got it · reveal</button>'
            : '<button class="btn" data-a="nextsong">No one yet · next song for '+ptsFor(S.song+1)+' pt'+(ptsFor(S.song+1)>1?'s':'')+' '+I.next+'</button>')+
      '<button class="btn link" data-a="nobody">Give up and reveal</button></div>';
  }

  function vReveal(){
    var h = S.history[S.history.length-1];
    var w = h && h.winner!=null ? S.players[h.winner] : null;
    var wc = w ? col(h.winner) : null;
    var stand = ranked().map(function(x,n){
      var c = col(x.i), isW = h && h.winner===x.i;
      return '<div class="stand" style="'+(isW?'background:'+c.bg:'')+'"><span class="n">'+(n+1)+'</span>'+
        '<span class="grow" style="font-size:17px;font-weight:'+(isW?700:600)+'">'+esc(x.p.name)+'</span>'+
        (isW?'<span style="font-size:13px;font-weight:600;color:'+c.c+'">+'+h.points+'</span>':'')+
        '<span class="pts">'+x.p.score+'</span></div>';
    }).join('');
    var lastRound = S.round >= S.rounds;
    return ''+
      '<div class="topbar"><span>Round '+S.round+' of '+S.rounds+' · done</span></div>'+
      '<div class="hero"><span class="label" style="font-size:14px">The country was</span>'+
      '<span class="big">'+esc(countryName(h.country))+'</span>'+
      (w ? '<span style="font-size:16px">'+esc(w.name)+' got it on song '+h.song+'</span>'+
           '<span class="display" style="font-size:20px;font-weight:700;color:'+wc.c+';background:'+wc.bg+';padding:6px 14px;border-radius:999px">+'+h.points+' pt'+(h.points>1?'s':'')+'</span>'
         : '<span style="font-size:16px" class="muted">Nobody got it this time</span>')+
      '</div>'+
      (h.songs && h.songs.length ? '<section class="stack" style="gap:8px"><div class="label">Songs played</div>'+h.songs.map(function(s){ return '<div class="card stack" style="gap:2px"><span style="font-weight:600">'+esc(cleanTitle(s[1]))+'</span><span class="muted" style="font-size:13px">'+esc(s[0])+' · '+esc(alsoText(s[2]))+'</span></div>'; }).join('')+'</section>' : '')+
      '<section class="stack" style="gap:8px"><div class="label">Standings</div>'+stand+'</section>'+
      '<div class="bottom"><button class="btn primary" data-a="nextround">'+(lastRound?'See the winner':'Next round')+'</button>'+
      '<div class="row" style="gap:10px"><button class="btn ghost grow" data-a="undo">Undo</button>'+
      (lastRound?'':'<button class="btn ghost grow" data-a="end">End game</button>')+'</div></div>';
  }

  function vFinal(){
    var r = ranked();
    var top = r[0];
    var tie = r.length>1 && r[1].p.score===top.p.score;
    function col3(x, place, height){
      if(!x) return '<div class="col"></div>';
      var c = col(x.i);
      return '<div class="col"><span>'+esc(x.p.name)+'</span><div class="blk" style="height:'+height+'px;background:'+c.bg+';border-color:'+c.c+'">'+
        '<span class="display" style="font-size:24px;font-weight:700">'+place+'</span><span class="muted" style="font-size:13px">'+x.p.score+' pts</span></div></div>';
    }
    var chips = S.history.map(function(h){
      return '<span class="chip">'+esc(countryName(h.country))+' · '+(h.winner!=null? esc(S.players[h.winner].name) : 'nobody')+'</span>';
    }).join('');
    return ''+
      '<div class="topbar"><span>Game over · '+S.history.length+' round'+(S.history.length===1?'':'s')+'</span></div>'+
      '<div class="stack" style="align-items:center;text-align:center;gap:8px;padding-top:8px">'+I.trophy+
      '<span class="label" style="font-size:14px">'+(tie?'It\'s a tie':'Winner')+'</span>'+
      '<span class="display" style="font-size:52px;font-weight:700;line-height:1">'+esc(tie? r.filter(function(x){return x.p.score===top.p.score;}).map(function(x){return x.p.name;}).join(' & ') : top.p.name)+'</span>'+
      '<span class="display" style="font-size:22px;font-weight:700;color:var(--accent)">'+top.p.score+' pts</span></div>'+
      '<div class="podium">'+col3(r[1],2,90)+col3(r[0],1,130)+col3(r[2],3,66)+'</div>'+
      (chips? '<section class="stack" style="gap:8px"><div class="label">Countries this game</div><div class="chips">'+chips+'</div></section>' : '')+
      '<div class="bottom"><button class="btn primary" data-a="rematch">Rematch, same players</button>'+
      '<button class="btn link" data-a="newgame">Change players</button></div>';
  }

  function menuSheet(){
    var stand = ranked().map(function(x,n){ return '<div class="stand"><span class="n">'+(n+1)+'</span><span class="grow" style="font-weight:600">'+esc(x.p.name)+'</span><span class="pts">'+x.p.score+'</span></div>'; }).join('');
    return '<div class="modal" data-a="closemenu"><div class="sheet" role="dialog" aria-modal="true" aria-label="Scores and menu" data-stop="1">'+
      '<h2 style="font-size:22px">Scores</h2>'+stand+
      '<button class="btn ghost" data-a="end">End game now</button>'+
      '<button class="btn ghost" data-a="newgame">Start over (new players)</button>'+
      '<button class="btn" data-a="closemenu">Close</button></div></div>';
  }

  // ---------- Actions ----------
  function markPlayed(){ var c=curSong(); if(!c) return; S.played=S.played||[]; if(!S.played.length || S.played[S.played.length-1][1]!==c[1]) S.played.push(c); }
  function newRound(){ S.country=null; S.song=1; S.search=''; S.screen='pick'; }

  var A = {
    host:function(d){ S.host=+d.i; },
    rm:function(d){ var i=+d.i; S.players.splice(i,1); if(S.host>=S.players.length || S.host===i) S.host=0; else if(i<S.host) S.host--; },
    rounds:function(d){ S.rounds=+d.n; },
    graded:function(){ S.graded=!S.graded; },
    start:function(){ if(guessers().length<1) return; S.players.forEach(function(p){p.score=0;}); S.round=1; S.used=[]; S.history=[]; newRound(); },
    choose:function(d){ S.country=d.c; },
    random:function(){ var left=COUNTRIES.filter(function(c){return S.used.indexOf(c[0])<0;}); if(left.length){ S.country=left[Math.floor(Math.random()*left.length)][0]; S.search=''; } },
    lock:function(){ if(!S.country) return; spMsg=''; S.song=1; S.played=[]; S.qpos=0; S.queue = hasLocal(S.country) ? shuffled(LOCAL[S.country].length) : null; S.screen='play'; },
    award:function(d){ var i=+d.i, pts=ptsFor(S.song); S.players[i].score+=pts; markPlayed(); S.history.push({round:S.round,country:S.country,winner:i,points:pts,song:S.song,songs:S.played.slice()}); S.used.push(S.country); S.screen='reveal'; },
    nextsong:function(){ if(S.song<S.songs){ markPlayed(); S.qpos++; S.song++; spMsg=''; } },
    skipsong:function(){ if(S.queue) S.qpos++; spMsg=''; },
    nobody:function(){ markPlayed(); S.history.push({round:S.round,country:S.country,winner:null,points:0,song:S.song,songs:S.played.slice()}); S.used.push(S.country); S.screen='reveal'; },
    undo:function(){ var h=S.history.pop(); if(!h) return; if(h.winner!=null) S.players[h.winner].score-=h.points; S.used.pop(); S.country=h.country; S.song=h.song; if(S.played && S.played.length) S.played.pop(); S.screen='play'; },
    nextround:function(){ if(S.round>=S.rounds){ S.screen='final'; return; } S.round++; newRound(); },
    end:function(){ modal=null; S.screen='final'; },
    rematch:function(){ A.start(); },
    newgame:function(){ modal=null; var keep=S.players.map(function(p){return {name:p.name,score:0};}); var host=S.host, rounds=S.rounds, graded=S.graded; S=fresh(); S.players=keep; S.host=host; S.rounds=rounds; S.graded=graded; },
    menu:function(){ modal=menuSheet(); },
    splogin:function(){ spLogin(); return 'async'; },
    spout:function(){ spDisconnect(); },
    spplay:function(){ var c=curSong(); if(c && !spBusy) spPlay(c); return 'async'; },
    sppause:function(){ spPause(); return 'async'; },
    closemenu:function(){ modal=null; }
  };

  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-a]');
    if(!t) return;
    if(t.classList.contains('modal') && e.target.closest('[data-stop]')) return;
    var a = t.getAttribute('data-a');
    if(A[a]){ e.preventDefault(); if(A[a](t.dataset) !== 'async') render(); }
  });

  app.addEventListener('submit', function(e){
    e.preventDefault();
    if(e.target.getAttribute('data-form') === 'cid'){
      var v = (document.getElementById('cid').value || '').trim();
      if(/^[0-9a-f]{32}$/i.test(v)){ SP.cid = v; saveSP(); spMsg = ''; } else { spMsg = 'That doesn\'t look like a Client ID (32 letters and numbers).'; }
      render(true); return;
    }
    var inp = document.getElementById('newp');
    var name = (inp.value||'').trim();
    if(!name) return;
    if(S.players.length>=8) return;
    S.players.push({name:name, score:0});
    render();
    var n = document.getElementById('newp'); if(n) n.focus();
  });

  app.addEventListener('input', function(e){
    if(e.target.id==='cs'){
      S.search = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var el = document.getElementById('cs'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
    }
  });

  // Hold-to-peek
  function peek(on){
    var t = document.getElementById('peekt');
    var c = curSong();
    if(t) t.textContent = on ? countryName(S.country) + (c ? ' · ' + c[0] : '') : 'Hold to peek';
  }
  app.addEventListener('pointerdown', function(e){ if(e.target.closest('#peek')){ e.preventDefault(); peek(true); } });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    app.addEventListener(ev, function(e){ if(e.target.closest && e.target.closest('#peek')) peek(false); }, true);
  });
  app.addEventListener('contextmenu', function(e){ if(e.target.closest('#peek')) e.preventDefault(); });

  render();
  if(CAN_SPOTIFY) spHandleRedirect().then(function(){ render(); });
})();
</script>
</body>
</html>
